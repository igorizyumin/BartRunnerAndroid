def gitBuildHash = 'unknown'
try {
    def gitProcess = new ProcessBuilder('git', 'rev-parse', '--short=12', 'HEAD')
            .directory(rootProject.projectDir)
            .redirectErrorStream(true)
            .start()
    gitProcess.waitFor()
    def resolvedHash = gitProcess.inputStream.getText('UTF-8').trim()
    if (gitProcess.exitValue() == 0 && !resolvedHash.isEmpty()) {
        gitBuildHash = resolvedHash
    }
} catch (Exception ignored) {
    // Source archives without Git metadata retain the fallback value.
}

